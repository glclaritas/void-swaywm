# /home/YOURUSER/.config/tmux/nnn.conf
set -g status off
set -g mouse off
set -g escape-time 0
set -as terminal-features ',foot*:sixel'

set-environment -g NNN_OPTS aA                  # enables -a, so NNN_FIFO exists
set-environment -g NNN_PLUG 'p:foot-preview'   # use your full NNN_PLUG string here
set-environment -g EDITOR nvim
